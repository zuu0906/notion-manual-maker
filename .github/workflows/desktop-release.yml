name: Desktop App Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Create .env.local from secrets
        working-directory: desktop
        run: |
          "GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" | Out-File -FilePath .env.local -Encoding utf8
          "GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" | Add-Content -Path .env.local

      - name: Build & publish Windows installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish=always
