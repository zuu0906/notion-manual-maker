name: 毎日ブログ自動投稿

on:
  schedule:
    - cron: '0 0 * * *'   # 毎日 09:00 JST (00:00 UTC)
  workflow_dispatch:        # 手動実行も可能

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 記事パイプライン実行
        working-directory: blog-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL:            ${{ secrets.WP_URL }}
          WP_USERNAME:       ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD:   ${{ secrets.WP_APP_PASSWORD }}
          WP_CATEGORY_ID:    ${{ secrets.WP_CATEGORY_ID }}
        run: node pipeline.js

      - name: 追跡ファイルをコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog-automation/.used-themes.json blog-automation/performance.json blog-automation/state/ || true
          git diff --staged --quiet || git commit -m "chore: update used themes, performance and pipeline state [skip ci]"
          git push || true
