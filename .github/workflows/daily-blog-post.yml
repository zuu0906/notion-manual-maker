name: ブログ自動投稿

on:
  schedule:
    - cron: '0 0 * * *'   # 毎日 09:00 JST (00:00 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード'
        required: true
        default: 'post'
        type: choice
        options:
          - post      # 新規記事を生成してWP投稿
          - rewrite   # 既存記事をリライト
      keyword:
        description: 'キーワード指定（post: 空欄=テーマから自動選択）'
        required: false
        type: string
      wp_id:
        description: 'WP記事ID（rewrite時に必須）'
        required: false
        type: string
      rewrite_instructions:
        description: 'リライト追加指示（rewrite時のみ有効、空欄可）'
        required: false
        type: string
      dry_run:
        description: 'ドライラン（WP投稿せず内容確認のみ）'
        required: false
        default: false
        type: boolean

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Claude Code CLI をインストール
        run: npm install -g @anthropic-ai/claude-code

      - name: ブログ処理実行
        working-directory: blog-automation
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WP_URL:            ${{ secrets.WP_URL }}
          WP_USERNAME:       ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD:   ${{ secrets.WP_APP_PASSWORD }}
          WP_CATEGORY_ID:    ${{ secrets.WP_CATEGORY_ID }}
        run: |
          MODE="${{ inputs.mode || 'post' }}"

          if [ "$MODE" = "rewrite" ]; then
            WP_ID="${{ inputs.wp_id }}"
            if [ -z "$WP_ID" ]; then
              echo "::error::rewriteモードにはwp_idの入力が必要です"
              exit 1
            fi
            ARGS=(--wp-id "$WP_ID")
            INSTRUCTIONS="${{ inputs.rewrite_instructions }}"
            [ -n "$INSTRUCTIONS" ] && ARGS+=(--instructions "$INSTRUCTIONS")
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS+=(--dry-run)
            node rewrite-article.js "${ARGS[@]}"

          else
            ARGS=()
            KEYWORD="${{ inputs.keyword }}"
            [ -n "$KEYWORD" ] && ARGS+=(--keyword "$KEYWORD")
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS+=(--dry-run)
            node pipeline.js "${ARGS[@]}"
          fi

      - name: 追跡ファイルをコミット
        if: ${{ inputs.mode != 'rewrite' && inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog-automation/.used-themes.json blog-automation/performance.json blog-automation/state/ || true
          git diff --staged --quiet || git commit -m "chore: update used themes, performance and pipeline state [skip ci]" || true
          git push || true
