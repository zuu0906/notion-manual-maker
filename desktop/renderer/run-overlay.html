<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';" />
  <title>自動実行HUD</title>
  <style>
    :root {
      --run:#2b7cff; --warn:#e08a16; --ok:#1e9e54; --error:#d93636;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:transparent; overflow:hidden;
      font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif; }
    /* ウィンドウ自体は透明。中央のカードだけを描画する */
    .card {
      position:absolute; left:8px; right:8px; bottom:8px;
      background:rgba(28,28,30,0.92); color:#fff; border-radius:14px;
      padding:12px 14px; display:flex; align-items:center; gap:12px;
      box-shadow:0 8px 28px rgba(0,0,0,0.38); border:1px solid rgba(255,255,255,0.08);
      -webkit-user-select:none; user-select:none;
    }
    .dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; background:var(--run);
      box-shadow:0 0 0 0 rgba(43,124,255,0.55); }
    .dot.busy { animation:pulse 1.1s ease-out infinite; }
    .tone-run   .dot { background:var(--run); }
    .tone-warn  .dot { background:var(--warn);  box-shadow:0 0 0 0 rgba(224,138,22,0.55); }
    .tone-ok    .dot { background:var(--ok); }
    .tone-error .dot { background:var(--error); }
    @keyframes pulse {
      0%   { box-shadow:0 0 0 0 rgba(255,255,255,0.45); }
      70%  { box-shadow:0 0 0 9px rgba(255,255,255,0); }
      100% { box-shadow:0 0 0 0 rgba(255,255,255,0); }
    }
    .body { min-width:0; flex:1; }
    .line1 { display:flex; align-items:baseline; gap:8px; }
    .step { font-variant-numeric:tabular-nums; font-weight:700; font-size:13px; color:#aab4c4; flex-shrink:0; }
    .title { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .detail { font-size:12px; color:#c7c7cc; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .esc { flex-shrink:0; font-size:11px; color:#c7c7cc; text-align:center; line-height:1.3; }
    .esc kbd {
      display:inline-block; font-family:inherit; font-size:11px; font-weight:700; color:#fff;
      background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.22);
      border-radius:5px; padding:1px 6px; margin-bottom:2px;
    }
  </style>
</head>
<body>
  <div id="card" class="card tone-run">
    <div id="dot" class="dot busy"></div>
    <div class="body">
      <div class="line1">
        <span id="step" class="step"></span>
        <span id="title" class="title">準備しています…</span>
      </div>
      <div id="detail" class="detail"></div>
    </div>
    <div class="esc"><kbd>Esc</kbd><br>停止</div>
  </div>
  <script src="run-overlay.js"></script>
</body>
</html>
