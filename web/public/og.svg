<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f0f0f"/>
  <!-- brand accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#FF3B30"/>

  <!-- logo circle -->
  <circle cx="120" cy="120" r="50" fill="#FF3B30"/>
  <text x="120" y="130" font-family="sans-serif" font-size="40" font-weight="bold"
        fill="white" text-anchor="middle">M</text>

  <!-- product name -->
  <text x="80" y="290" font-family="sans-serif" font-size="56" font-weight="700"
        fill="white">Chrome Manual Maker</text>

  <!-- tagline -->
  <text x="80" y="370" font-family="sans-serif" font-size="32" fill="#aaaaaa">
    クリックするだけで操作マニュアルが完成
  </text>
  <text x="80" y="420" font-family="sans-serif" font-size="28" fill="#666666">
    スクリーンショット + 矢印を自動生成 → Notionへ即保存
  </text>

  <!-- pill badges -->
  <rect x="80" y="480" width="200" height="44" rx="22" fill="#FF3B30"/>
  <text x="180" y="508" font-family="sans-serif" font-size="20" font-weight="600"
        fill="white" text-anchor="middle">Chrome拡張機能</text>

  <rect x="298" y="480" width="160" height="44" rx="22" fill="#333"/>
  <text x="378" y="508" font-family="sans-serif" font-size="20" fill="#ccc"
        text-anchor="middle">Notion連携</text>

  <rect x="476" y="480" width="120" height="44" rx="22" fill="#333"/>
  <text x="536" y="508" font-family="sans-serif" font-size="20" fill="#ccc"
        text-anchor="middle">無料から</text>

  <!-- annotation demo (right side) -->
  <rect x="750" y="80" width="380" height="240" rx="12" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <rect x="750" y="80" width="380" height="32" rx="12" fill="#252525"/>
  <circle cx="775" cy="96" r="6" fill="#ff5f57"/>
  <circle cx="797" cy="96" r="6" fill="#febc2e"/>
  <circle cx="819" cy="96" r="6" fill="#28c840"/>
  <text x="940" y="100" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">example.com</text>

  <!-- fake UI elements -->
  <rect x="770" y="130" width="200" height="12" rx="6" fill="#2a2a2a"/>
  <rect x="770" y="152" width="160" height="12" rx="6" fill="#2a2a2a"/>
  <rect x="770" y="174" width="100" height="32" rx="6" fill="#FF3B30" opacity="0.8"/>

  <!-- annotation arrow + circle -->
  <circle cx="870" cy="190" r="14" fill="#FF3B30"/>
  <text x="870" y="196" font-family="sans-serif" font-size="14" font-weight="bold"
        fill="white" text-anchor="middle">1</text>
  <line x1="856" y1="176" x2="840" y2="160" stroke="#FF3B30" stroke-width="3"
        marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#FF3B30"/>
    </marker>
  </defs>

  <rect x="750" y="340" width="380" height="60" rx="8" fill="#1a1a1a" stroke="#333"/>
  <text x="770" y="366" font-family="sans-serif" font-size="13" fill="#888">ステップ 1: ボタンをクリック</text>
  <text x="770" y="386" font-family="sans-serif" font-size="11" fill="#555">example.com</text>
  <rect x="1080" y="352" width="36" height="36" rx="6" fill="#FF3B30" opacity="0.9"/>
  <text x="1098" y="376" font-family="sans-serif" font-size="20" fill="white"
        text-anchor="middle">↗</text>
</svg>
